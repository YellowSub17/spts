ackages = ["spts"] # Replace with the actual folder name containing your .py files

[build-system]
# We need numpy and setuptools at build time to compile the C++ extensions
requires = ["setuptools>=61.0", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[project]
name = "spts"
version = "0.0.2"
description = "SPTS - Single Particle Tracking and Sizing"
readme = "README.md"
authors = [{name = "Hantke, Max Felix", email = "hantke@xray.bmc.uu.se"}]
license = {text = "BSD"}
keywords = ["mie", "scattering", "single", "particle"]
classifiers = [
"Development Status :: 3 - Alpha",
"Intended Audience :: Science/Research",
"Topic :: Scientific/Engineering :: Physics",
"License :: OSI Approved :: BSD License",
"Programming Language :: Python :: 3",
]
requires-python = ">=3.7"
dependencies = [
"numpy",
"scipy",
"h5py",
# "h5writer", # Uncomment if these are available on PyPI
# "mulpro>=0.1.3",
]

[project.optional-dependencies]
mpi = ["mpi4py>=1.3.1"]
gui = ["PyQt5", "pyqtgraph"] # Note: PyQt4 is extremely old; upgraded to 5 here

[tool.setuptools]
packages = ["spts"]
include-package-data = true

[tool.setuptools.package-data]
"*" = ["gui/ui/*.ui", "gui/spts_default.conf"]
